[project]
name = "vibedpn"
version = "0.1.0.dev0"
description = "VibeDPN core: router engine, API and CLI of the DPN box"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pydantic>=2.11",
  "ruamel-yaml>=0.19.1",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.scripts]
vibedpn = "vibedpn.cli:app"
vibedpn-core = "vibedpn.api.server:main"

[dependency-groups]
dev = [
  "httpx2>=2.12.0",
  "mypy>=1.16",
  "pytest>=8.3",
  "ruff>=0.16.7,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibedpn"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["vibedpn", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "A",        # builtins shadowing
  "C4",       # comprehensions
  "SIM",      # simplify
  "PTH",      # pathlib over os.path
  "RUF",      # ruff-specific
  "ANN",      # annotations everywhere
  "T20",      # no print()
  "ERA",      # no commented-out code
  "PL",       # pylint
]
ignore = [
  "PLR0913",  # many arguments in CLI callbacks are the Typer idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["vibedpn"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["vibedpn", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
