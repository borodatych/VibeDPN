# CI: lint and test the core, lint shell and workflows, validate compose, build multi-arch images
# (pushed to GHCR on main / next / tags, build-only on pull requests).
# Action majors verified 2026-09-11 (docs/knowledge/ci/githubActions.md); setup-uv has no floating
# major tag, so it is pinned to an exact release.
name: CI

on:
  push:
    branches: [main, next]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One run per ref at a time: two overlapping runs would otherwise race for the same image tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.13"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  python:
    name: core · ruff, mypy, pytest (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Debian 12 system Python (the CLI on the box), 3.12 = the core image, 3.13 = Debian 13.
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --frozen --no-dev --group build --no-emit-project --no-header > /tmp/requirements.txt
          diff -u <(grep -v '^#' requirements.txt) /tmp/requirements.txt

  install:
    name: install.sh · ${{ matrix.debian }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v7
      - name: Run the installer twice, then `vibedpn init`, in a clean Debian container (docker CLI stubbed)
        run: |
          docker run --rm -v "$PWD:/src:ro" "debian:${{ matrix.debian }}-slim" bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
            git config --global --add safe.directory "*"
            git clone -q /src /tmp/repo
            git -C /tmp/repo checkout -q -b ci-install
            install -m 755 /src/tests/install/docker-stub.sh /usr/local/bin/docker
            export VIBEDPN_REPO=/tmp/repo VIBEDPN_BRANCH=ci-install
            bash /src/install.sh
            test -L /usr/local/bin/vibedpn
            vibedpn --version
            bash /src/install.sh
            vibedpn init --role vps --endpoint 203.0.113.7
            test -f /opt/vibedpn/config.yaml
            test -f /opt/vibedpn/.env
            test ! -e /opt/vibedpn/secrets/htpasswd
            before=$(sha256sum /opt/vibedpn/config.yaml)
            if vibedpn init --role vps --endpoint 203.0.113.7; then echo "init must refuse without --force" >&2; exit 1; fi
            test "$before" = "$(sha256sum /opt/vibedpn/config.yaml)"
            test ! -e /opt/vibedpn/config.yaml.bak
            vibedpn init --role vps --endpoint 203.0.113.7 --force
            test -f /opt/vibedpn/config.yaml.bak
          '

  ui:
    name: ui · lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: present
        name: Is the UI scaffolded yet (Stage 6)?
        run: |
          if [ -f ui/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: steps.present.outputs.yes == 'true'
        run: npm ci
        working-directory: ui
      - if: steps.present.outputs.yes == 'true'
        run: npm run lint
        working-directory: ui

  shell:
    name: shell · shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck

  workflows:
    name: workflows · actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download a pinned actionlint release and verify its checksum
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "${archive}" actionlint
      - run: ./actionlint -color

  compose:
    name: compose · config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile '*' config -q

  images:
    name: image · ${{ matrix.image.name }}
    needs: [python, shell, compose, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: core
            context: core
          - name: wg
            context: images/wg
          - name: ui
            context: ui
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Image name (GHCR namespaces are lower-case)
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vibedpn-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
