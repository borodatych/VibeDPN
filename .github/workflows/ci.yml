# CI: lint and test the core, lint shell and workflows, validate compose, build multi-arch images
# (pushed to GHCR on main / next / tags, build-only on pull requests).
# Action majors verified 2026-09-11 (docs/knowledge/ci/githubActions.md); setup-uv has no floating
# major tag, so it is pinned to an exact release.
name: CI

on:
  push:
    branches: [main, next]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One run per ref at a time: two overlapping runs would otherwise race for the same image tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.13"
  ACTIONLINT_VERSION: "1.7.12"
  # Pinned like actionlint: the shellcheck of the runner image lags and disagrees with a
  # developer's own about which checks exist (0.9 reports SC2317 where 0.11 reports SC2329).
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  python:
    name: core · ruff, mypy, pytest (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Debian 12 system Python (the CLI on the box), 3.12 = the core image, 3.13 = Debian 13.
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --frozen --no-dev --group build --no-emit-project --no-header > /tmp/requirements.txt
          diff -u <(grep -v '^#' requirements.txt) /tmp/requirements.txt

  install:
    name: install.sh · ${{ matrix.debian }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v7
      - name: Run the installer twice, then `vibedpn init` and `vibedpn doctor`, in a clean Debian container (docker CLI stubbed)
        run: |
          docker run --rm -v "$PWD:/src:ro" "debian:${{ matrix.debian }}-slim" bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
            git config --global --add safe.directory "*"
            git clone -q /src /tmp/repo
            git -C /tmp/repo checkout -q -b ci-install
            install -m 755 /src/tests/install/docker-stub.sh /usr/local/bin/docker
            export VIBEDPN_REPO=/tmp/repo VIBEDPN_BRANCH=ci-install
            bash /src/install.sh
            test -L /usr/local/bin/vibedpn
            vibedpn --version
            bash /src/install.sh
            echo "ci-panels-pw" > /tmp/pw
            vibedpn init --role vps --endpoint 203.0.113.7 --password-file /tmp/pw
            test -f /opt/vibedpn/config.yaml
            test -f /opt/vibedpn/.env
            test -f /opt/vibedpn/secrets/htpasswd
            test -f /opt/vibedpn/data/myst-provider/nodeui-pass
            before=$(sha256sum /opt/vibedpn/config.yaml)
            if vibedpn init --role vps --endpoint 203.0.113.7 --password-file /tmp/pw; then echo "init must refuse without --force" >&2; exit 1; fi
            test "$before" = "$(sha256sum /opt/vibedpn/config.yaml)"
            test ! -e /opt/vibedpn/config.yaml.bak
            vibedpn init --role vps --endpoint 203.0.113.7 --password-file /tmp/pw --force
            test -f /opt/vibedpn/config.yaml.bak
            if vibedpn doctor > /tmp/doctor.txt; then echo "doctor must fail with a stubbed docker" >&2; exit 1; fi
            cat /tmp/doctor.txt
            grep -q "^\[FAIL\] docker" /tmp/doctor.txt
            grep -q "^\[ ok \] config" /tmp/doctor.txt
          '

  ui:
    name: ui · types, lint, unit and dom tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate && bun run generate
      - run: bun run check
      - run: bun run test:unit && bun run test:dom

  shell:
    name: shell · shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download a pinned shellcheck release and verify its checksum
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar xJf "${archive}" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - run: git ls-files -z '*.sh' | xargs -0 ./shellcheck

  workflows:
    name: workflows · actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download a pinned actionlint release and verify its checksum
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "${archive}" actionlint
      - run: ./actionlint -color

  compose:
    name: compose · config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile '*' config -q

  firewall:
    name: firewall · nft apply in a NET_ADMIN container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Render the VPS ruleset with the package, then check it and apply it twice
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" python:3.12-slim-trixie bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nftables >/dev/null
            pip install -q --require-hashes -r /src/core/requirements.txt
            pip install -q --no-deps --no-build-isolation /src/core
            python - <<"PY" > /tmp/vibedpn.nft
          from vibedpn.config import Config
          from vibedpn.engine.router import firewall_ruleset
          base = {"version": 1, "role": "vps", "provider": {"enabled": True}, "wg_server": {"endpoint": "203.0.113.7"}, "firewall": {"ssh_ports": [22, 2222], "allow_tcp": [443]}}
          print(firewall_ruleset(Config.model_validate(base)), end="")
          narrowed = {**base, "provider": {"enabled": True, "udp_ports": "56000-56050"}}
          with open("/tmp/narrowed.nft", "w") as out:
              out.write(firewall_ruleset(Config.model_validate(narrowed)))
          PY
            nft -c -f - < /tmp/vibedpn.nft
            nft -f - < /tmp/vibedpn.nft
            nft -f - < /tmp/vibedpn.nft
            nft list table inet vibedpn | tee /tmp/loaded.nft
            grep -q "tcp dport { 22, 2222 } accept" /tmp/loaded.nft
            grep -q "dhcpv6 client" /tmp/loaded.nft
            # Home boxes reach only the node panel and the core API, and the tunnel subnet
            # is dropped anywhere but wg0.
            grep -q "ip daddr 10.78.0.0/24 iifname != \"wg0\" drop" /tmp/loaded.nft
            grep -q "iifname \"wg0\" tcp dport { 4449, 4480 } accept" /tmp/loaded.nft
            if grep -q "iifname \"wg0\" accept" /tmp/loaded.nft; then echo "wg0 is open to everything"; exit 1; fi
            grep -q "policy drop" /tmp/loaded.nft
            # An overlapping UDP range must replace the old set elements, not clash with them.
            nft -f - < /tmp/narrowed.nft
            nft list set inet vibedpn myst_udp | tee /tmp/set.nft
            grep -q "56000-56050" /tmp/set.nft
            if grep -q "56100" /tmp/set.nft; then echo "old range survived re-apply"; exit 1; fi
            python - <<"PY"
          from vibedpn.config import Config
          from vibedpn.engine.router import apply_firewall
          disabled = Config.model_validate({"version": 1, "role": "vps", "provider": {"enabled": True}, "wg_server": {"endpoint": "203.0.113.7"}, "firewall": {"enabled": False}})
          assert apply_firewall(disabled) is False
          assert apply_firewall(disabled) is False  # idempotent on a missing table
          PY
            if nft list tables | grep -q vibedpn; then echo "table survived teardown"; exit 1; fi
          '
      - name: Tunnel egress — NAT table and DOCKER-USER rules, applied twice and removed
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" python:3.12-slim-trixie bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends iptables nftables >/dev/null
            pip install -q --require-hashes -r /src/core/requirements.txt
            pip install -q --no-deps --no-build-isolation /src/core
            python - <<"PY"
          from vibedpn.config import Config
          from vibedpn.engine.router import Egress, apply_tunnel_egress
          base = {"version": 1, "role": "vps", "provider": {"enabled": True}, "wg_server": {"endpoint": "203.0.113.7"}, "firewall": {"enabled": False}}
          assert apply_tunnel_egress(Config.model_validate(base)) is Egress.NO_DOCKER_DROP
          PY
            nft list table inet vibedpn_egress | tee /tmp/egress.nft
            grep -q "ip saddr 10.78.0.0/24 oifname != \"wg0\" masquerade" /tmp/egress.nft
            grep -q "ip saddr 10.78.0.0/24 oifname \"br-\*\" drop" /tmp/egress.nft
            grep -q "169.254.0.0/16" /tmp/egress.nft
            # A Docker host: the chain exists, and the rules must land once, however often core starts.
            iptables-nft -N DOCKER-USER
            iptables-nft -A DOCKER-USER -i eth9 -j DROP
            python - <<"PY"
          from vibedpn.config import Config
          from vibedpn.engine.router import Egress, apply_tunnel_egress
          base = {"version": 1, "role": "vps", "provider": {"enabled": True}, "wg_server": {"endpoint": "203.0.113.7"}}
          for _ in range(2):
              assert apply_tunnel_egress(Config.model_validate(base)) is Egress.DOCKER_USER
          PY
            iptables-nft -S DOCKER-USER | tee /tmp/user.txt
            test "$(grep -c vibedpn-egress /tmp/user.txt)" = 2
            grep -q -- "-i eth9 -j DROP" /tmp/user.txt
            python - <<"PY"
          from vibedpn.config import Config
          from vibedpn.engine.router import Egress, apply_tunnel_egress
          moved = {"version": 1, "role": "vps", "provider": {"enabled": True}, "wg_server": {"endpoint": "203.0.113.7", "subnet": "10.99.0.0/24"}}
          assert apply_tunnel_egress(Config.model_validate(moved)) is Egress.DOCKER_USER
          PY
            iptables-nft -S DOCKER-USER | tee /tmp/moved.txt
            test "$(grep -c "10.99.0.0/24.*vibedpn-egress" /tmp/moved.txt)" = 2
            if grep -q 10.78.0.0 /tmp/moved.txt; then echo "rules of the old subnet survived"; exit 1; fi
            python - <<"PY"
          from vibedpn.config import Config
          from vibedpn.engine.router import Egress, apply_tunnel_egress
          client = {"version": 1, "role": "client", "network": {"lan_interface": "eth0", "lan_subnet": "192.168.1.0/24", "lan_address": "192.168.1.50"}, "routing": {"mode": "off", "default_upstream": "vps"}, "upstreams": {"vps": {"enabled": True}}}
          assert apply_tunnel_egress(Config.model_validate(client)) is Egress.NONE
          PY
            if nft list tables | grep -q vibedpn_egress; then echo "egress table survived"; exit 1; fi
            if iptables-nft -S DOCKER-USER | grep -q vibedpn-egress; then echo "DOCKER-USER rules survived"; exit 1; fi
            iptables-nft -S DOCKER-USER | grep -q -- "-i eth9 -j DROP"
          '

  router:
    name: router · LAN marks, ip rules, uplink tables and DOCKER-USER in a NET_ADMIN container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply the LAN router twice, follow the gateway, switch modes, remove it
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" python:3.12-slim-trixie bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends iproute2 iptables nftables >/dev/null
            pip install -q --require-hashes -r /src/core/requirements.txt
            pip install -q --no-deps --no-build-isolation /src/core
            ip link add vibedpn0 type bridge
            ip addr add 10.77.0.1/24 dev vibedpn0
            ip link set vibedpn0 up
            iptables-nft -N DOCKER-USER
            cat > /tmp/router.py <<"PY"
          import sys
          from vibedpn.config import Config, Upstream
          from vibedpn.engine.router import apply_router, remove_router, set_gateway_route
          def box(mode, failopen=False):
              return Config.model_validate({"version": 1, "role": "client", "network": {"lan_interface": "eth0", "lan_subnet": "192.168.1.0/24", "lan_address": "192.168.1.50"}, "routing": {"mode": mode, "default_upstream": "vps", "failopen": failopen}, "upstreams": {"vps": {"enabled": True}}})
          step = sys.argv[1]
          if step == "full":
              assert apply_router(box("full")) == [Upstream.VPS]
          elif step == "alive":
              set_gateway_route(Upstream.VPS, True)
          elif step == "dead":
              set_gateway_route(Upstream.VPS, False)
          elif step == "failopen":
              apply_router(box("full", failopen=True))
          elif step == "off":
              assert apply_router(box("off")) == []
          elif step == "remove":
              remove_router()
          PY
            python /tmp/router.py full
            python /tmp/router.py full
            nft list table inet vibedpn_router | tee /tmp/router.nft
            grep -q "meta mark set 0x00000010" /tmp/router.nft
            grep -q "icmp type redirect drop" /tmp/router.nft
            # Device policies: eight sets load (empty ones too) and win over the mode.
            test "$(grep -c "set devices_" /tmp/router.nft)" = 8
            grep -q "ether saddr @devices_bypass_mac return" /tmp/router.nft
            # nat-unprotected leaves the gateway ports to us: the LAN reaches them only through a gateway.
            grep -q "iifname \"eth0\" ip daddr 10.77.0.0/24 drop" /tmp/router.nft
            test "$(ip rule show | grep -c "fwmark 0x10 lookup 7710")" = 1
            ip route show table 7710 | grep -q "unreachable default"
            test "$(iptables-nft -S DOCKER-USER | grep -c vibedpn-router)" = 5
            # The gateway answers: its route wins; it goes quiet: only the kill switch is left.
            python /tmp/router.py alive
            ip route show table 7710 | grep -q "default via 10.77.0.10 dev vibedpn0"
            python /tmp/router.py dead
            if ip route show table 7710 | grep -q "via 10.77.0.10"; then echo "gateway route survived"; exit 1; fi
            ip route show table 7710 | grep -q "unreachable default"
            python /tmp/router.py failopen
            if ip route show table 7710 | grep -q unreachable; then echo "failopen kept the kill switch"; exit 1; fi
            python /tmp/router.py off
            if ip rule show | grep -q "lookup 7710"; then echo "mode off kept the uplink rule"; exit 1; fi
            if nft list table inet vibedpn_router | grep -q "routing.mode full: LAN traffic"; then echo "mode off still marks by mode"; exit 1; fi
            python /tmp/router.py remove
            python /tmp/router.py remove
            if nft list tables | grep -q vibedpn_router; then echo "router table survived"; exit 1; fi
            if iptables-nft -S DOCKER-USER | grep -q vibedpn-router; then echo "DOCKER-USER rules survived"; exit 1; fi
          '

  adguard:
    name: adguard · config from core, password, empty AAAA in full, box name, UI settings survive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Let core write AdGuardHome.yaml, start the pinned AdGuard on it, restart over an edited file
        run: |
          set -eu
          work="$(mktemp -d)"
          mkdir -p "$work/conf" "$work/work" "$work/secrets" "$work/data"
          docker run --rm -v "$PWD:/src:ro" -v "$work:/work" python:3.12-slim-trixie bash -eu -c '
            pip install -q --require-hashes -r /src/core/requirements.txt
            pip install -q --no-deps --no-build-isolation /src/core
            python - <<"PY"
          from pathlib import Path
          import bcrypt
          from vibedpn.config import Config
          from vibedpn.engine.adguard import ensure_adguard
          hashed = bcrypt.hashpw(b"ci-adguard-123", bcrypt.gensalt(12)).decode()
          Path("/work/secrets/htpasswd").write_text(f"admin:{hashed}\\n")
          raw = {"version": 1, "role": "client", "network": {"lan_interface": "lo", "lan_subnet": "127.0.0.0/8", "lan_address": "127.0.0.2"}, "routing": {"mode": "full", "default_upstream": "vps"}, "upstreams": {"vps": {"enabled": True}}, "dns": {"web_port": 3001}}
          assert ensure_adguard(Config.model_validate(raw), Path("/work/conf"), Path("/work/secrets"), Path("/work/data")) is True
          PY
          '
          start_adguard() {
            docker run -d --name adguard --network host -v "$work/conf:/opt/adguardhome/conf" \
              -v "$work/work:/opt/adguardhome/work" adguard/adguardhome:v0.107.79 >/dev/null
            for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.2:3001/ && return 0; sleep 1; done
            docker logs adguard; exit 1
          }
          start_adguard
          login() {
            curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"name\":\"admin\",\"password\":\"$1\"}" http://127.0.0.2:3001/control/login
          }
          test "$(login ci-adguard-123)" = 200
          test "$(login wrong-password)" = 403
          cat > "$work/dns.py" <<"PY"
          import socket, struct, sys
          # dns.py <qtype> [name] [addr]: the answer count, or with "addr" the IPv4 of the last A answer.
          qtype = int(sys.argv[1])
          name = sys.argv[2] if len(sys.argv) > 2 else "google.com"
          labels = b"".join(bytes([len(part)]) + part.encode() for part in name.split("."))
          query = struct.pack("!HHHHHH", 7, 0x0100, 1, 0, 0, 0) + labels + b"\x00" + struct.pack("!HH", qtype, 1)
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.settimeout(5)
          sock.sendto(query, ("127.0.0.2", 53))
          reply, _ = sock.recvfrom(2048)
          count = struct.unpack("!H", reply[6:8])[0]
          print(socket.inet_ntoa(reply[-4:]) if len(sys.argv) > 3 and count else count)
          PY
          test "$(docker run --rm -i --network host python:3.12-slim-trixie python - 28 < "$work/dns.py")" = 0
          test "$(docker run --rm -i --network host python:3.12-slim-trixie python - 1 < "$work/dns.py")" -gt 0
          # The box name (ui.host_name, default vibedpn.lan) answers with the box address: core's rewrite is live.
          test "$(docker run --rm -i --network host python:3.12-slim-trixie python - 1 vibedpn.lan addr < "$work/dns.py")" = 127.0.0.2
          # A setting made in the AdGuard UI (here: a disabled filter) survives core's next pass.
          docker rm -f adguard >/dev/null
          sudo sed -i "0,/enabled: false/s//enabled: true/" "$work/conf/AdGuardHome.yaml"
          enabled_before="$(sudo grep -c "enabled: true" "$work/conf/AdGuardHome.yaml")"
          docker run --rm -v "$PWD:/src:ro" -v "$work:/work" python:3.12-slim-trixie bash -eu -c '
            pip install -q --require-hashes -r /src/core/requirements.txt
            pip install -q --no-deps --no-build-isolation /src/core
            python - <<"PY"
          from pathlib import Path
          from vibedpn.config import Config
          from vibedpn.engine.adguard import ensure_adguard
          raw = {"version": 1, "role": "client", "network": {"lan_interface": "lo", "lan_subnet": "127.0.0.0/8", "lan_address": "127.0.0.2"}, "routing": {"mode": "off", "default_upstream": "vps"}, "upstreams": {"vps": {"enabled": True}}, "dns": {"web_port": 3001}}
          assert ensure_adguard(Config.model_validate(raw), Path("/work/conf"), Path("/work/secrets"), Path("/work/data")) is True
          PY
          '
          test "$(sudo grep -c "enabled: true" "$work/conf/AdGuardHome.yaml")" = "$enabled_before"
          start_adguard
          test "$(docker run --rm -i --network host python:3.12-slim-trixie python - 28 < "$work/dns.py")" -gt 0
          docker rm -f adguard >/dev/null

  ui-image:
    name: ui · image, sign-in with the init password, core behind the session
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the panel image, start it with its database and a fake core, check the doors
        run: |
          set -eu
          docker build -t vibedpn-ui:ci ui
          work="$(mktemp -d)"
          trap 'docker rm -f ui ui-db fake-core >/dev/null 2>&1 || true' EXIT
          mkdir -p "$work/api" "$work/secrets"
          echo ok > "$work/api/health"
          password=ci-secret-123
          hash="$(docker run --rm --entrypoint bun vibedpn-ui:ci -e 'console.log(await Bun.password.hash(process.argv[1], {algorithm: "bcrypt"}))' "$password")"
          printf 'admin:%s\n' "$hash" > "$work/secrets/htpasswd"
          openssl rand -hex 24 | tr -d '\n' > "$work/secrets/ui-db-password"
          openssl rand -hex 32 | tr -d '\n' > "$work/secrets/ui-auth-secret"
          sudo chown root:root "$work/secrets/"*
          sudo chmod 600 "$work/secrets/"*
          docker run -d --name ui-db -p 127.0.0.1:5480:5432 -e POSTGRES_USER=vibedpn -e POSTGRES_DB=vibedpn \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/ui-db-password \
            -v "$work/secrets/ui-db-password:/run/secrets/ui-db-password:ro" postgres:17.11-alpine >/dev/null
          for _ in $(seq 30); do docker exec ui-db pg_isready -U vibedpn -d vibedpn >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name fake-core --network host -v "$work/api:/srv:ro" python:3.12-slim-trixie \
            python -m http.server 4480 --bind 127.0.0.1 --directory /srv >/dev/null
          secrets=(-v "$work/secrets/htpasswd:/run/secrets/htpasswd:ro"
            -v "$work/secrets/ui-db-password:/run/secrets/ui-db-password:ro"
            -v "$work/secrets/ui-auth-secret:/run/secrets/ui-auth-secret:ro")
          base=http://127.0.0.1:8088
          docker run -d --name ui --network host -e UI_LISTEN_HOST=127.0.0.1 -e PORT=8088 \
            -e SERVER_URL=$base -e CLIENT_URL=$base -e UI_HOST_NAME=vibedpn.lan -e CORE_API_PORT=4480 -e UI_DB_PORT=5480 \
            "${secrets[@]}" vibedpn-ui:ci >/dev/null
          for _ in $(seq 60); do curl -fsS -o /dev/null $base/api/health && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code $base/api/health)" = 200
          # Listens on the given address only.
          if curl -s -o /dev/null --max-time 3 "http://$(hostname -I | awk '{print $1}'):8088/api/health"; then
            echo "the panel answers on a non-listen address"; exit 1
          fi
          # Core only behind a session.
          test "$(code $base/api/core/health)" = 401
          sign_in() { curl -s -o /dev/null -w '%{http_code}' -c "$work/jar" -H "Origin: $base" \
            -H 'Content-Type: application/json' -d "{\"email\":\"admin@vibedpn.lan\",\"password\":\"$1\"}" \
            $base/api/auth/sign-in/email; }
          test "$(sign_in wrong-password)" = 401
          test "$(sign_in "$password")" = 200
          test "$(code -b "$work/jar" $base/api/core/health)" = 200
          # The box name (ui.host_name) is an allowed origin; any other name is not.
          by_origin() { curl -s -o /dev/null -w '%{http_code}' -H "Origin: $1" -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@vibedpn.lan\",\"password\":\"$password\"}" $base/api/auth/sign-in/email; }
          test "$(by_origin http://vibedpn.lan:8088)" = 200
          test "$(by_origin http://evil.lan:8088)" = 403
          # Nobody signs up.
          signup="$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $base" -H 'Content-Type: application/json' \
            -d '{"email":"x@example.com","password":"12345678","name":"x"}' $base/api/auth/sign-up/email)"
          test "$signup" != 200
          # Brute force is limited, and a forged X-Forwarded-For does not reset the count.
          limited=no
          for n in 1 2 3 4 5 6; do
            answer="$(curl -s -o /dev/null -w '%{http_code}' -H "Origin: $base" -H "X-Forwarded-For: 10.9.9.$n" \
              -H 'Content-Type: application/json' -d '{"email":"admin@vibedpn.lan","password":"wrong-password"}' \
              $base/api/auth/sign-in/email)"
            [ "$answer" = 429 ] && limited=yes
          done
          test "$limited" = yes
          docker rm -f ui >/dev/null
          # A missing or empty secret: the container refuses to start.
          : > "$work/empty"
          if docker run --rm --network host -e UI_DB_PORT=5480 -v "$work/empty:/run/secrets/htpasswd:ro" \
            -v "$work/secrets/ui-db-password:/run/secrets/ui-db-password:ro" \
            -v "$work/secrets/ui-auth-secret:/run/secrets/ui-auth-secret:ro" vibedpn-ui:ci > "$work/refused.log" 2>&1; then
            echo "ui started with an empty password file"; exit 1
          fi
          grep -q "is missing or empty" "$work/refused.log"

  tunnel:
    name: tunnel · wg handshake and kill switch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Load the WireGuard module of the runner kernel
        run: |
          sudo modprobe wireguard
          lsmod | grep -q '^wireguard'
      - name: Two containers, a real tunnel between them and a kill switch that holds
        run: |
          docker build -t ghcr.io/borodatych/vibedpn-wg:test images/wg
          VIBEDPN_WG_IMAGE=ghcr.io/borodatych/vibedpn-wg:test tests/wg/tunnel.sh

  e2e:
    name: e2e · box + fake VPS + LAN device — exit address, kill switch, modes, DNS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Load the WireGuard module of the runner kernel
        run: sudo modprobe wireguard
      - name: Build the images the box runs
        run: |
          docker build -q -t ghcr.io/borodatych/vibedpn-core:e2e core
          docker build -q -t ghcr.io/borodatych/vibedpn-wg:e2e images/wg
      - name: The CLI in a venv
        run: |
          uv venv /tmp/e2e-venv --python 3.12
          uv pip install --python /tmp/e2e-venv/bin/python --require-hashes -r core/requirements.txt
          uv pip install --python /tmp/e2e-venv/bin/python --no-deps ./core
      - name: Run the stand
        env:
          VIBEDPN_TAG: e2e
          VIBEDPN_E2E_PYTHON: /tmp/e2e-venv/bin/python
        run: tests/e2e/router.sh

  images:
    name: image · ${{ matrix.image.name }}
    needs: [python, shell, compose, install, firewall, router, ui, ui-image, adguard, tunnel, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: core
            context: core
          - name: wg
            context: images/wg
          - name: ui
            context: ui
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Image name (GHCR namespaces are lower-case)
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vibedpn-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
