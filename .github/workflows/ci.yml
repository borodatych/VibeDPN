# CI: lint and test the core, lint shell and workflows, validate compose, build multi-arch images
# (pushed to GHCR on main / next / tags, build-only on pull requests).
# Action majors verified 2026-09-11 (docs/knowledge/ci/githubActions.md); setup-uv has no floating
# major tag, so it is pinned to an exact release.
name: CI

on:
  push:
    branches: [main, next]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# One run per ref at a time: two overlapping runs would otherwise race for the same image tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.13"
  ACTIONLINT_VERSION: "1.7.12"
  # Pinned like actionlint: the shellcheck of the runner image lags and disagrees with a
  # developer's own about which checks exist (0.9 reports SC2317 where 0.11 reports SC2329).
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  python:
    name: core · ruff, mypy, pytest (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Debian 12 system Python (the CLI on the box), 3.12 = the core image, 3.13 = Debian 13.
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --frozen --no-dev --group build --no-emit-project --no-header > /tmp/requirements.txt
          diff -u <(grep -v '^#' requirements.txt) /tmp/requirements.txt

  install:
    name: install.sh · ${{ matrix.debian }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v7
      - name: Run the installer twice, then `vibedpn init` and `vibedpn doctor`, in a clean Debian container (docker CLI stubbed)
        run: |
          docker run --rm -v "$PWD:/src:ro" "debian:${{ matrix.debian }}-slim" bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
            git config --global --add safe.directory "*"
            git clone -q /src /tmp/repo
            git -C /tmp/repo checkout -q -b ci-install
            install -m 755 /src/tests/install/docker-stub.sh /usr/local/bin/docker
            export VIBEDPN_REPO=/tmp/repo VIBEDPN_BRANCH=ci-install
            bash /src/install.sh
            test -L /usr/local/bin/vibedpn
            vibedpn --version
            bash /src/install.sh
            echo "ci-panels-pw" > /tmp/pw
            vibedpn init --role vps --endpoint 203.0.113.7 --password-file /tmp/pw
            test -f /opt/vibedpn/config.yaml
            test -f /opt/vibedpn/.env
            test -f /opt/vibedpn/secrets/htpasswd
            test -f /opt/vibedpn/data/myst-provider/nodeui-pass
            before=$(sha256sum /opt/vibedpn/config.yaml)
            if vibedpn init --role vps --endpoint 203.0.113.7 --password-file /tmp/pw; then echo "init must refuse without --force" >&2; exit 1; fi
            test "$before" = "$(sha256sum /opt/vibedpn/config.yaml)"
            test ! -e /opt/vibedpn/config.yaml.bak
            vibedpn init --role vps --endpoint 203.0.113.7 --password-file /tmp/pw --force
            test -f /opt/vibedpn/config.yaml.bak
            if vibedpn doctor > /tmp/doctor.txt; then echo "doctor must fail with a stubbed docker" >&2; exit 1; fi
            cat /tmp/doctor.txt
            grep -q "^\[FAIL\] docker" /tmp/doctor.txt
            grep -q "^\[ ok \] config" /tmp/doctor.txt
          '

  ui:
    name: ui · lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: present
        name: Is the UI scaffolded yet (Stage 6)?
        run: |
          if [ -f ui/package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: steps.present.outputs.yes == 'true'
        run: npm ci
        working-directory: ui
      - if: steps.present.outputs.yes == 'true'
        run: npm run lint
        working-directory: ui

  shell:
    name: shell · shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download a pinned shellcheck release and verify its checksum
        run: |
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          tar xJf "${archive}" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      - run: git ls-files -z '*.sh' | xargs -0 ./shellcheck

  workflows:
    name: workflows · actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download a pinned actionlint release and verify its checksum
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "${archive}" actionlint
      - run: ./actionlint -color

  compose:
    name: compose · config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile '*' config -q

  firewall:
    name: firewall · nft apply in a NET_ADMIN container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Render the VPS ruleset with the package, then check it and apply it twice
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" python:3.12-slim-trixie bash -eu -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nftables >/dev/null
            pip install -q --require-hashes -r /src/core/requirements.txt
            pip install -q --no-deps --no-build-isolation /src/core
            python - <<"PY" > /tmp/vibedpn.nft
          from vibedpn.config import Config
          from vibedpn.engine.router import firewall_ruleset
          base = {"version": 1, "role": "vps", "provider": {"enabled": True}, "wg_server": {"endpoint": "203.0.113.7"}, "firewall": {"ssh_ports": [22, 2222], "allow_tcp": [443]}}
          print(firewall_ruleset(Config.model_validate(base)), end="")
          narrowed = {**base, "provider": {"enabled": True, "udp_ports": "56000-56050"}}
          with open("/tmp/narrowed.nft", "w") as out:
              out.write(firewall_ruleset(Config.model_validate(narrowed)))
          PY
            nft -c -f - < /tmp/vibedpn.nft
            nft -f - < /tmp/vibedpn.nft
            nft -f - < /tmp/vibedpn.nft
            nft list table inet vibedpn | tee /tmp/loaded.nft
            grep -q "tcp dport { 22, 2222 } accept" /tmp/loaded.nft
            grep -q "dhcpv6 client" /tmp/loaded.nft
            # Home boxes reach only the node panel and the core API, and the tunnel subnet
            # is dropped anywhere but wg0.
            grep -q "ip daddr 10.78.0.0/24 iifname != \"wg0\" drop" /tmp/loaded.nft
            grep -q "iifname \"wg0\" tcp dport { 4449, 4480 } accept" /tmp/loaded.nft
            if grep -q "iifname \"wg0\" accept" /tmp/loaded.nft; then echo "wg0 is open to everything"; exit 1; fi
            grep -q "policy drop" /tmp/loaded.nft
            # An overlapping UDP range must replace the old set elements, not clash with them.
            nft -f - < /tmp/narrowed.nft
            nft list set inet vibedpn myst_udp | tee /tmp/set.nft
            grep -q "56000-56050" /tmp/set.nft
            if grep -q "56100" /tmp/set.nft; then echo "old range survived re-apply"; exit 1; fi
            python - <<"PY"
          from vibedpn.config import Config
          from vibedpn.engine.router import apply_firewall
          disabled = Config.model_validate({"version": 1, "role": "vps", "provider": {"enabled": True}, "wg_server": {"endpoint": "203.0.113.7"}, "firewall": {"enabled": False}})
          assert apply_firewall(disabled) is False
          assert apply_firewall(disabled) is False  # idempotent on a missing table
          PY
            if nft list tables | grep -q vibedpn; then echo "table survived teardown"; exit 1; fi
          '

  tunnel:
    name: tunnel · wg handshake and kill switch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Load the WireGuard module of the runner kernel
        run: |
          sudo modprobe wireguard
          lsmod | grep -q '^wireguard'
      - name: Two containers, a real tunnel between them and a kill switch that holds
        run: |
          docker build -t ghcr.io/borodatych/vibedpn-wg:test images/wg
          VIBEDPN_WG_IMAGE=ghcr.io/borodatych/vibedpn-wg:test tests/wg/tunnel.sh

  images:
    name: image · ${{ matrix.image.name }}
    needs: [python, shell, compose, install, firewall, tunnel]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: core
            context: core
          - name: wg
            context: images/wg
          - name: ui
            context: ui
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Image name (GHCR namespaces are lower-case)
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vibedpn-${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
