# OS images with VibeDPN preinstalled (docs/manuals/osImages.md, docs/decisions.md 13 and 15).
# Heavy and slow, so not on every push: by hand, or for a release tag. The images stay artifacts of
# the run; attaching them to a GitHub Release is a separate, deliberate step of the owner.
name: os-images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of VibeDPN the image follows
        default: main
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  uefi:
    name: image · UEFI ${{ matrix.architecture }} (debos)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      # fakemachine needs /dev/kvm; hosted Linux runners have it once the runner user may open it
      # (https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/)
      - name: KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # fakemachine shares only the recipe directory and the working directory with its VM, and the
      # recipe reads images/os/common and install.sh (run 35373779695 died on
      # `stat /recipes/images/os/common`): the working directory is the repository root, and the
      # image lands there. Scratch on disk: the root filesystem with Docker does not fit the tmpfs
      # of the VM. The arm64 image needs no emulation on the runner: the VM registers the qemu-user
      # binaries of the debos container itself.
      - name: Build
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: |
          docker run --rm --device /dev/kvm --group-add "$(getent group kvm | cut -d: -f3)" \
            -v "$PWD:/recipes" -w /recipes godebos/debos --fakemachine-backend=kvm \
            --cpus 4 --memory 4GB --scratchsize 8GB \
            -t "architecture:${{ matrix.architecture }}" -t "branch:$BRANCH" images/os/debos/vibedpn.yaml
      - name: Tools for the boot test
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q mtools ${{ matrix.architecture == 'amd64' && 'qemu-system-x86 ovmf' || 'qemu-system-arm qemu-efi-aarch64' }}
      - name: Boot test
        run: sh tests/os/uefiBoot.sh "vibedpn-${{ matrix.architecture }}.img"
      - name: Compress
        run: xz -T0 -v "vibedpn-${{ matrix.architecture }}.img"
      - uses: actions/upload-artifact@v5
        with:
          name: vibedpn-uefi-${{ matrix.architecture }}
          path: vibedpn-${{ matrix.architecture }}.img.xz
          if-no-files-found: error

  raspberry-pi:
    name: image · Raspberry Pi arm64 (pi-gen)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          VIBEDPN_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: sh images/os/pi-gen/build.sh
      # no Raspberry Pi in CI: the image is mounted and its CLI and Docker run in a chroot
      - name: Check the image
        env:
          VIBEDPN_OS_BRANCH: ${{ inputs.branch || github.ref_name }}
        run: sudo --preserve-env=VIBEDPN_OS_BRANCH sh tests/os/piImage.sh images/os/pi-gen/work/deploy/*.img.xz
      - uses: actions/upload-artifact@v5
        with:
          name: vibedpn-raspberry-pi-arm64
          path: images/os/pi-gen/work/deploy/*.img.xz
          if-no-files-found: error
