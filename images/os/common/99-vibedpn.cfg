# VibeDPN OS image (UEFI): access comes from the owner, never from the image.
# cloud-init reads user-data and meta-data from the FAT partition labelled CIDATA — the ESP of the
# image carries that label, so the owner edits user-data on any computer before the first boot
# (docs/knowledge/platform/piGen.md, NoCloud). Without a seed the box boots with no remote access.
datasource_list: [NoCloud, None]
