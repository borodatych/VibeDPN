{{- $architecture := or .architecture "amd64" -}}
{{- $branch := or .branch "main" -}}
{{- $repo := or .repo "https://github.com/borodatych/VibeDPN.git" -}}
{{- $image := or .image (printf "vibedpn-%s.img" $architecture) -}}
# VibeDPN OS image for UEFI machines (N100 and other amd64, arm64 boards with UEFI), Debian trixie.
#   debos -t architecture:arm64 -t branch:next images/os/debos/vibedpn.yaml
# Run from the repository root: fakemachine shares only the recipe directory and the working
# directory with its VM, and the recipe reads ../common and ../../../install.sh; the image lands in
# the working directory.
# No secret inside: access comes from user-data on the CIDATA partition (docs/decisions.md, 15).
architecture: {{ $architecture }}

actions:
  - action: debootstrap
    suite: trixie
    components: [main]
    mirror: https://deb.debian.org/debian
    variant: minbase

  - action: apt
    packages:
      - systemd-sysv
      - udev
      - dbus
      - {{ if eq $architecture "amd64" }}linux-image-amd64{{ else }}linux-image-arm64{{ end }}
      - {{ if eq $architecture "amd64" }}grub-efi-amd64{{ else }}grub-efi-arm64{{ end }}
      - initramfs-tools
      - cloud-init
      - openssh-server
      - sudo
      - ca-certificates
      - curl
      - git
      - iproute2
      - nftables
      - python3
      - python3-venv
      - systemd-resolved
      - systemd-timesyncd
      # cloud-init configures the network through ifupdown (its first renderer); without a network
      # stack the image booted with no address at all (tests/os/uefiBoot.sh, 2026-09-20)
      - ifupdown
      - dhcpcd-base
      # what a Debian install has and minbase does not: the first boot grows the root filesystem
      # to the disk (cloud-init growpart and resizefs), fsck of both partitions, ps for the CLI,
      # an editor, a pager and ping for the owner
      - cloud-guest-utils
      - gdisk
      - e2fsprogs
      - dosfstools
      - procps
      - nano
      - less
      - iputils-ping

  - action: overlay
    source: ../common
    destination: /var/tmp/vibedpn-image

  - action: run
    chroot: true
    command: cp /var/tmp/vibedpn-image/99-vibedpn.cfg /etc/cloud/cloud.cfg.d/99-vibedpn.cfg

  # debootstrap names the root filesystem after the build VM (fakemachine); user-data may rename it
  - action: run
    chroot: true
    command: echo vibedpn >/etc/hostname && printf '127.0.0.1\tlocalhost\n127.0.1.1\tvibedpn\n' >/etc/hosts

  - action: run
    chroot: false
    command: cp "${RECIPEDIR}/../../../install.sh" "${ROOTDIR}/var/tmp/vibedpn-image/install.sh"

  - action: run
    chroot: true
    command: env VIBEDPN_REPO={{ $repo }} VIBEDPN_BRANCH={{ $branch }} sh /var/tmp/vibedpn-image/provision.sh

  # openssh-server generated host keys while it was installed: every box from the image would share
  # them. cloud-init makes new ones on the first boot (ssh_deletekeys and ssh_genkeytypes defaults),
  # before sshd starts.
  - action: run
    chroot: true
    command: rm -f /etc/ssh/ssh_host_*

  - action: image-partition
    imagename: {{ $image }}
    imagesize: 6GB
    partitiontype: gpt
    mountpoints:
      - mountpoint: /
        partition: root
      - mountpoint: /boot/efi
        partition: CIDATA
    partitions:
      - name: CIDATA
        fs: vfat
        start: 1MiB
        end: 513MiB
        flags: [boot, esp]
      - name: root
        fs: ext4
        start: 513MiB
        end: 100%

  - action: filesystem-deploy
    setup-fstab: true
    setup-kernel-cmdline: true

  # the kernel talks to the screen and to the serial port: headless boxes, VMs and tests/os/uefiBoot.sh
  - action: run
    chroot: true
    command: sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="quiet console=tty0 console={{ if eq $architecture "amd64" }}ttyS0{{ else }}ttyAMA0{{ end }},115200"/' /etc/default/grub

  - action: run
    chroot: true
    command: >-
      grub-install --target={{ if eq $architecture "amd64" }}x86_64-efi{{ else }}arm64-efi{{ end }}
      --efi-directory=/boot/efi --removable --no-nvram &&
      update-grub

  - action: run
    chroot: false
    command: cp "${RECIPEDIR}/../common/seed/meta-data" "${RECIPEDIR}/../common/seed/user-data.example" "${ROOTDIR}/boot/efi/"
