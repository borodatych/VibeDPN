# VibeDPN — all services of every role in one file; a role is a set of Compose profiles.
# `vibedpn init` writes COMPOSE_PROFILES and the VIBEDPN_* values into .env from config.yaml
# (see .env.example). Defaults below only make `docker compose config` work without .env;
# they never open anything beyond loopback.
#
# Third-party images are pinned to versions verified on 2026-09-11 (docs/knowledge/).
name: vibedpn

services:
  # Core: API, router engine (Stage 4) and CLI backend. Host network + NET_ADMIN because it is
  # the only component allowed to program nftables / ip rule on the host. Never touches the
  # host default route: every uplink is a gateway container on the `upstreams` network.
  core:
    image: ghcr.io/borodatych/vibedpn-core:${VIBEDPN_TAG:-latest}
    build:
      context: ./core
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    volumes:
      # The box directory, writable: core changes device policies in config.yaml (vibedpn device
      # set, PUT /devices) with a temporary file and a rename, and a rename over a single
      # bind-mounted file fails with EBUSY. A missing config.yaml still stops core with one line.
      - type: bind
        source: .
        target: /etc/vibedpn/box
      - ./secrets:/etc/vibedpn/secrets
      - ./data/core:/var/lib/vibedpn
      # core keeps its keys of AdGuardHome.yaml current before adguard starts (engine/adguard.py).
      - ./data/adguard/conf:/etc/vibedpn/adguard
      # core renders dnsmasq.conf of gateway mode before dnsmasq starts (engine/dnsmasq.py).
      - ./data/dnsmasq:/etc/vibedpn/dnsmasq
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${VIBEDPN_API_PORT:-4480}/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Web UI: the start0 app (ui/) on Bun, on the LAN address only. The core API is reachable from
  # the LAN only through its /api/core/* behind a session; sign-in checks the bcrypt line of
  # secrets/htpasswd on every attempt. Built by CI only (docs/uiVariants.md).
  ui:
    # full (N100) or lite (Raspberry Pi): ui.variant in config.yaml, two images of one code base.
    image: ghcr.io/borodatych/vibedpn-ui:${VIBEDPN_TAG:-latest}-${VIBEDPN_UI_VARIANT:-full}
    build:
      context: ./ui
      args:
        UI_VARIANT: ${VIBEDPN_UI_VARIANT:-full}
    profiles:
      - ui
    network_mode: host
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      ui-db:
        condition: service_healthy
    volumes:
      # Missing secret files fail loudly instead of becoming directories; the entrypoint refuses empty ones.
      - type: bind
        source: ./secrets/htpasswd
        target: /run/secrets/htpasswd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/ui-db-password
        target: /run/secrets/ui-db-password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/ui-auth-secret
        target: /run/secrets/ui-auth-secret
        read_only: true
        bind:
          create_host_path: false
    environment:
      UI_LISTEN_HOST: ${VIBEDPN_LAN_IP:-127.0.0.1}
      PORT: ${VIBEDPN_UI_PORT:-80}
      SERVER_URL: http://${VIBEDPN_LAN_IP:-127.0.0.1}:${VIBEDPN_UI_PORT:-80}
      CLIENT_URL: http://${VIBEDPN_LAN_IP:-127.0.0.1}:${VIBEDPN_UI_PORT:-80}
      UI_HOST_NAME: ${VIBEDPN_UI_HOST_NAME:-vibedpn.lan}
      CORE_API_PORT: ${VIBEDPN_API_PORT:-4480}
      UI_DB_PORT: ${VIBEDPN_UI_DB_PORT:-5480}
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://${VIBEDPN_LAN_IP:-127.0.0.1}:${VIBEDPN_UI_PORT:-80}/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Postgres of the panel (the start0 pack is bound to it: Prisma adapter, pg-boss, LISTEN/NOTIFY).
  # Published on host loopback only, for `ui` on the host network. Password from init.
  ui-db:
    image: postgres:${UI_DB_TAG:-17.11-alpine}
    profiles:
      - ui
    restart: unless-stopped
    # Postgres defaults unless ui.variant is lite, which writes smaller values into .env.
    command:
      - postgres
      - -c
      - shared_buffers=${VIBEDPN_UI_DB_SHARED_BUFFERS:-128MB}
      - -c
      - max_connections=${VIBEDPN_UI_DB_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_USER: vibedpn
      POSTGRES_DB: vibedpn
      POSTGRES_PASSWORD_FILE: /run/secrets/ui-db-password
    ports:
      - "127.0.0.1:${VIBEDPN_UI_DB_PORT:-5480}:5432"
    volumes:
      # Postgres 17 images: the data volume goes to /var/lib/postgresql/data, not its parent.
      - ./data/ui-db:/var/lib/postgresql/data
      - type: bind
        source: ./secrets/ui-db-password
        target: /run/secrets/ui-db-password
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibedpn -d vibedpn"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Mysterium provider node (roles home, vps). Bridge network with the UDP range published, as in
  # the official Docker guide; NodeUI (4449) and TequilAPI (4050) only on host loopback: TequilAPI
  # answers without any authentication (verified on 1.39.5), so the network is its only guard.
  # The NodeUI password is the bcrypt file data/myst-provider/nodeui-pass written by `vibedpn init`.
  # `--udp.ports`, `--traversal`, `--tequilapi.*`, `--ui.*` are GLOBAL options of `myst` and must
  # precede the command; `--agreed-terms-and-conditions` belongs to `service`. The old
  # --p2p.listen.ports / --wireguard.listen.ports / --experiment-natpunching are deprecated.
  myst-provider:
    image: mysteriumnetwork/myst:${MYST_TAG:-1.39.5-alpine}
    profiles:
      - provider
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 127.0.0.1:4449:4449  # NodeUI; keep equal to NODEUI_PORT in core/vibedpn/engine/myst.py
      - 127.0.0.1:4050:4050  # TequilAPI; keep equal to TEQUILAPI_PORT there
      - ${VIBEDPN_MYST_UDP_FROM:-56000}-${VIBEDPN_MYST_UDP_TO:-56100}:${VIBEDPN_MYST_UDP_FROM:-56000}-${VIBEDPN_MYST_UDP_TO:-56100}/udp
    volumes:
      - ./data/myst-provider:/var/lib/mysterium-node
    command:
      - --udp.ports=${VIBEDPN_MYST_UDP_FROM:-56000}:${VIBEDPN_MYST_UDP_TO:-56100}
      - --traversal=${VIBEDPN_MYST_TRAVERSAL:-manual,upnp,holepunching}
      - --tequilapi.address=0.0.0.0
      - service
      - --agreed-terms-and-conditions

  # Mysterium consumer = uplink `dpn`: a gateway container at 10.77.0.20 (roles home, client), built
  # on the official image (images/myst-consumer). Its entrypoint adds gateway rules — LAN traffic
  # leaves only through the tunnel, NAT, MSS clamping — and lets only core (10.77.0.1, the host
  # side of vibedpn0) reach TequilAPI, which answers without authentication (verified on 1.39.5);
  # the host router drops LAN traffic to 10.77.0.0/24 as well. core drives the consumer (Stage 8).
  myst-consumer:
    image: ghcr.io/borodatych/vibedpn-myst-consumer:${VIBEDPN_TAG:-latest}
    build:
      context: ./images/myst-consumer
      args:
        MYST_TAG: ${MYST_TAG:-1.39.5-alpine}
    profiles:
      - consumer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/vibedpn-dpn-entrypoint", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      upstreams:
        ipv4_address: 10.77.0.20
    volumes:
      - ./data/myst-consumer:/var/lib/mysterium-node
    command:
      - --firewall.killSwitch.always
      - --ui.enable=false
      - --tequilapi.address=0.0.0.0
      - daemon

  # WireGuard client = uplink `vps`: a gateway container at 10.77.0.10 (role client). Uses the
  # host kernel WireGuard module (no /dev/net/tun). A gateway in its own netns: forwarding into wg0
  # only, MASQUERADE, TCP MSS clamping and the kill switch in nftables (images/wg/entrypoint.sh).
  wg-client:
    image: ghcr.io/borodatych/vibedpn-wg:${VIBEDPN_TAG:-latest}
    build:
      context: ./images/wg
    profiles:
      - wg-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    networks:
      upstreams:
        ipv4_address: 10.77.0.10
    volumes:
      # `vibedpn init --peer-config` stores the peer file exactly here; no directory fallback.
      - type: bind
        source: ./secrets/wg-client.conf
        target: /etc/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
    command:
      - client
    healthcheck:
      # The interface is up and the peer answered recently; a dead tunnel is not "running".
      test: ["CMD", "/usr/local/bin/entrypoint.sh", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # WireGuard server of the VPS (wg0 10.78.0.1/24 by default). Host network: no port mapping,
  # the UDP port is opened by the nftables baseline core applies (Stage 2/3).
  wg-server:
    image: ghcr.io/borodatych/vibedpn-wg:${VIBEDPN_TAG:-latest}
    build:
      context: ./images/wg
    profiles:
      - wg-server
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    depends_on:
      # core renders secrets/wg-server/wg0.conf from config.yaml before it reports healthy.
      core:
        condition: service_healthy
    volumes:
      - ./secrets/wg-server:/etc/wireguard:ro
    command:
      - server
    healthcheck:
      # A server with no peer connected yet is healthy; only a missing wg0 is not.
      test: ["CMD", "/usr/local/bin/entrypoint.sh", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AdGuard Home on port 53 of the LAN address. Host network (needed for DHCP later and for real
  # client IPs); core renders AdGuardHome.yaml into ./data/adguard/conf so the setup wizard on
  # port 3000 never appears (Stage 4).
  # DHCP of gateway mode (network.mode gateway only: the profile dhcp never runs next to the DHCP
  # server of an ISP router). Host network on the LAN interface; the config comes from core.
  dnsmasq:
    image: ghcr.io/borodatych/vibedpn-dnsmasq:${VIBEDPN_TAG:-latest}
    build:
      context: ./images/dnsmasq
    profiles:
      - dhcp
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      core:
        condition: service_healthy
    volumes:
      - ./data/dnsmasq:/var/lib/vibedpn-dnsmasq

  adguard:
    image: adguard/adguardhome:${ADGUARD_TAG:-v0.107.79}
    profiles:
      - dns
    restart: unless-stopped
    network_mode: host
    depends_on:
      # core writes bind address, upstreams, the password and aaaa_disabled into its config first.
      core:
        condition: service_healthy
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf

networks:
  # Gateway containers live here with static addresses; core steers marked LAN traffic to them.
  # Docker's DOCKER chain drops every packet entering a bridge from another interface unless
  # the network is `nat-unprotected` (Engine >= 28.0.0); `trusted_host_interfaces` does NOT help:
  # it only admits packets addressed to a container's own published ports. The price of this
  # mode is that Docker no longer filters container ports, so the router engine (Stage 4) must
  # itself drop LAN traffic addressed to 10.77.0.0/24 and pass only transit.
  # Network options are frozen at creation: changing them needs the network recreated.
  upstreams:
    name: vibedpn-upstreams
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected
      # A fixed name the host rules of core match on (UPSTREAMS_BRIDGE in engine/router.py).
      com.docker.network.bridge.name: vibedpn0
    ipam:
      config:
        - subnet: 10.77.0.0/24
